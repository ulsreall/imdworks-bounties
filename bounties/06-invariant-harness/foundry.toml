[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib", "deps/node_modules"]
solc = "0.8.29"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[profile.default.invariant]
runs = 1000
depth = 100
fail_on_revert = false
shrink_run_limit = 5000

[profile.broken]
src = "src"
out = "out-broken"
test = "test-broken"
libs = ["lib", "deps/node_modules"]
solc = "0.8.29"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[profile.broken.invariant]
runs = 250
depth = 50
fail_on_revert = false
